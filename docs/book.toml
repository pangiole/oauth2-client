[book]
title = "Walkthrough an OAuth2 Client in Rust"
authors = ["Paolo Angioletti"]
description = "A book explaining how to implement an OAuth2 / OIDC OAuth2 Client application in Rust language with the Tokio asynchronous runtime"
language = "en"
src = "src"

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output]

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
site-url = "/oauth2-client/"
git-repository-url = "https://github.com/pangiole/oauth2-client"
